<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>La Cenaduria | Pedidos</title>
    <style>
      :root { font-family: Inter, "Segoe UI", sans-serif; color: #202124; background: #f7f8f9; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; color: white; background: #204b3c; }
      h1 { margin: 0; font-size: 20px; font-weight: 650; }
      header p { margin: 3px 0 0; color: #dbe9e4; font-size: 13px; }
      button { min-height: 38px; border: 1px solid #b7bfbc; border-radius: 6px; padding: 8px 13px; color: #202124; background: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #f0f3f2; }
      button.primary { border-color: #176b4d; color: white; background: #176b4d; }
      button.primary:hover { background: #12573f; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      main { display: grid; grid-template-columns: minmax(520px, 1fr) minmax(340px, 430px); min-height: calc(100vh - 70px); }
      .orders { overflow: auto; border-right: 1px solid #d8dddb; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #d8dddb; background: white; }
      .toolbar strong { font-size: 14px; }
      table { width: 100%; border-collapse: collapse; background: white; }
      th, td { padding: 11px 12px; border-bottom: 1px solid #e5e8e7; text-align: left; white-space: nowrap; font-size: 13px; }
      th { position: sticky; top: 0; color: #53605c; background: #f3f5f4; font-size: 11px; text-transform: uppercase; }
      tbody tr { cursor: pointer; }
      tbody tr:hover, tbody tr.selected { background: #edf5f1; }
      .status { display: inline-block; padding: 3px 6px; border-radius: 4px; color: #5b4100; background: #fff1c2; font-size: 11px; font-weight: 700; }
      .status.confirmed { color: #15553d; background: #d9f1e7; }
      aside { padding: 20px; overflow: auto; background: #fbfcfc; }
      aside h2 { margin: 0 0 4px; font-size: 18px; }
      .muted { color: #68736f; font-size: 13px; }
      .empty { padding: 48px 20px; color: #68736f; text-align: center; }
      form { display: grid; gap: 13px; margin-top: 20px; }
      label { display: grid; gap: 5px; color: #46504d; font-size: 12px; font-weight: 650; }
      input, select, textarea { width: 100%; min-height: 39px; border: 1px solid #bac2bf; border-radius: 5px; padding: 8px 10px; color: #202124; background: white; font: inherit; }
      textarea { min-height: 70px; resize: vertical; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 0; border-top: 1px solid #d8dddb; border-bottom: 1px solid #d8dddb; }
      .totals span { display: block; color: #68736f; font-size: 11px; }
      .totals strong { display: block; margin-top: 3px; font-size: 15px; }
      .actions { display: flex; gap: 8px; }
      .actions button { flex: 1; }
      #notice { min-height: 20px; color: #15553d; font-size: 13px; }
      #notice.error { color: #a32727; }
      @media (max-width: 900px) {
        main { display: block; }
        .orders { max-height: 48vh; border-right: 0; border-bottom: 1px solid #d8dddb; }
      }
    </style>
  </head>
  <body>
    <header>
      <div><h1>La Cenaduria</h1><p>Pedidos, entrega y recogida</p></div>
      <button id="refresh" type="button">Actualizar</button>
    </header>
    <main>
      <section class="orders">
        <div class="toolbar"><strong>Pedidos recientes</strong><span class="muted" id="count">0 pedidos</span></div>
        <table>
          <thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Modalidad</th><th>Fecha</th><th>Estado</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="table-empty">No hay pedidos todavia.</div>
      </section>
      <aside>
        <div class="empty" id="detail-empty">Selecciona un pedido para administrarlo.</div>
        <section id="detail" hidden>
          <h2 id="order-title"></h2>
          <div class="muted" id="customer"></div>
          <p id="product-summary"></p>
          <form id="order-form">
            <div class="grid">
              <label>Modalidad<select name="fulfillmentType" required><option value="">Seleccionar</option><option value="PICKUP">Recoger</option><option value="DELIVERY">Entrega</option></select></label>
              <label>Ciudad<select name="city"><option value="">No aplica</option><option value="BRAMPTON">Brampton</option><option value="MISSISSAUGA">Mississauga</option></select></label>
            </div>
            <label>Direccion<input name="address" autocomplete="street-address"></label>
            <div class="grid">
              <label>Codigo postal<input name="postalCode" autocomplete="postal-code"></label>
              <label>Costo de entrega<input name="deliveryFee" type="number" min="0" step="0.01"></label>
            </div>
            <div class="grid">
              <label>Fecha<input name="requestedDate" type="date" required></label>
              <label>Horario<input name="timeWindow" placeholder="3:00 - 3:30 p. m." required></label>
            </div>
            <label>Notas<textarea name="customerNotes"></textarea></label>
            <div class="totals">
              <div><span>Productos</span><strong id="products-total"></strong></div>
              <div><span>Entrega</span><strong id="delivery-total"></strong></div>
              <div><span>Total</span><strong id="grand-total"></strong></div>
            </div>
            <div id="notice"></div>
            <div class="actions">
              <button id="save" type="submit">Guardar</button>
              <button id="confirm" class="primary" type="button">Confirmar y avisar</button>
            </div>
          </form>
        </section>
      </aside>
    </main>
    <script>
      const state = { orders: [], selected: null };
      const rows = document.querySelector("#rows");
      const form = document.querySelector("#order-form");
      const notice = document.querySelector("#notice");

      function money(value, currency = "CAD") {
        return new Intl.NumberFormat("en-CA", { style: "currency", currency: currency || "CAD" }).format(Number(value || 0));
      }
      function formData() { return Object.fromEntries(new FormData(form).entries()); }
      function setNotice(message, error = false) { notice.textContent = message; notice.classList.toggle("error", error); }
      function renderRows() {
        rows.innerHTML = "";
        document.querySelector("#count").textContent = `${state.orders.length} pedidos`;
        document.querySelector("#table-empty").hidden = state.orders.length > 0;
        for (const order of state.orders) {
          const row = document.createElement("tr");
          if (state.selected?.orderId === order.orderId) row.className = "selected";
          const confirmed = order.status === "CONFIRMADO" ? " confirmed" : "";
          row.innerHTML = `<td>${order.orderId}</td><td>${order.customerName || order.phone}</td><td>${money(order.grandTotal || order.total, order.currency)}</td><td>${order.fulfillmentType || "Pendiente"}</td><td>${order.requestedDate || "-"}</td><td><span class="status${confirmed}">${order.status || "NUEVO"}</span></td>`;
          row.addEventListener("click", () => selectOrder(order));
          rows.appendChild(row);
        }
      }
      function selectOrder(order) {
        state.selected = order;
        document.querySelector("#detail-empty").hidden = true;
        document.querySelector("#detail").hidden = false;
        document.querySelector("#order-title").textContent = `Pedido ${order.orderId}`;
        document.querySelector("#customer").textContent = `${order.customerName || "Cliente"} | ${order.phone || "Sin telefono"}`;
        document.querySelector("#product-summary").textContent = order.productSummary || "Sin resumen de productos";
        for (const [key, value] of Object.entries(order)) if (form.elements[key]) form.elements[key].value = value ?? "";
        document.querySelector("#products-total").textContent = money(order.total, order.currency);
        document.querySelector("#delivery-total").textContent = money(order.deliveryFee, order.currency);
        document.querySelector("#grand-total").textContent = money(order.grandTotal || order.total, order.currency);
        document.querySelector("#confirm").disabled = order.status === "CONFIRMADO";
        setNotice("");
        renderRows();
      }
      async function loadOrders() {
        const response = await fetch("/api/orders");
        state.orders = await response.json();
        if (state.selected) state.selected = state.orders.find((order) => order.orderId === state.selected.orderId) || null;
        renderRows();
        if (state.selected) selectOrder(state.selected);
      }
      async function save(confirm = false) {
        if (!state.selected) return;
        setNotice(confirm ? "Confirmando..." : "Guardando...");
        const endpoint = `/api/orders/${state.selected.orderId}${confirm ? "/confirm" : ""}`;
        const response = await fetch(endpoint, { method: confirm ? "POST" : "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(formData()) });
        const result = await response.json();
        if (!response.ok) return setNotice(result.error || "No se pudo guardar.", true);
        setNotice(confirm ? "Pedido confirmado y mensaje enviado." : "Cambios guardados.");
        await loadOrders();
      }
      form.addEventListener("submit", (event) => { event.preventDefault(); save(false); });
      document.querySelector("#confirm").addEventListener("click", () => save(true));
      document.querySelector("#refresh").addEventListener("click", loadOrders);
      loadOrders().catch((error) => setNotice(error.message, true));
      setInterval(loadOrders, 30000);
    </script>
  </body>
</html>
